<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="loading-overlay hidden">
      <div class="loading-content">
        <div class="spinner"></div>
        <h2 class="loading-text">Finding Tokyo...</h2>
      </div>
    </div>
    <div class="hero-background"></div>
    <main>
      <header class="nav"><a href="#"> About</a><a href="#">Developer Info</a></header>
      <div class="intro">
        <h1 class="app-name">Welcome to Jeff's Weather App</h1>
        <form id="search-city">
          <input
            type="text"
            id="search-bar"
            name="search-bar"
            placeholder="Search Your City"
            required
          />
          <button id="submit" type="submit"></button>
        </form>
      </div>
      <div class="features">
        <div class="f1"></div>
        <div class="f2"></div>
        <div class="f3"></div>
      </div>
      <div class="weather-container"></div>
    </main>
    <footer></footer>
  </body>
</html>
